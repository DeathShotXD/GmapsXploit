<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="gtitle gdesc">
  <title id="gtitle">GmapsXploit - one exposed Google API key mapped across thirty-one endpoints</title>
  <desc id="gdesc">A dark cyber map with red exposed-key pins, a green restricted pin, a glowing route, and a billing impact panel reading eight thousand three hundred eighty-three dollars per hundred thousand requests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04101a"/>
      <stop offset=".52" stop-color="#061824"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx=".76" cy=".28" r=".62">
      <stop offset="0" stop-color="#8bff4a" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#8bff4a" stop-opacity=".035"/>
      <stop offset="1" stop-color="#8bff4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx=".86" cy=".44" r=".5">
      <stop offset="0" stop-color="#ff2d46" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ff2d46" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ff2d46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordCream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".6" stop-color="#f4e5c8"/>
      <stop offset="1" stop-color="#e7d3ad"/>
    </linearGradient>
    <linearGradient id="wordGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7ffb5"/>
      <stop offset=".42" stop-color="#8bff4a"/>
      <stop offset="1" stop-color="#5fe22b"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd9f2"/>
      <stop offset=".52" stop-color="#8bff4a"/>
      <stop offset="1" stop-color="#f4e5c8"/>
    </linearGradient>
    <linearGradient id="impact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bff4a"/>
      <stop offset=".55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff2d46"/>
    </linearGradient>
    <linearGradient id="scanBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bff4a" stop-opacity="0"/>
      <stop offset=".45" stop-color="#8bff4a" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#2fd9f2" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2fd9f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bff4a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8bff4a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#2fd9f2" stroke-opacity=".045"/>
    </pattern>
    <pattern id="streets" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#2fd9f2" stroke-opacity=".12"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r=".85" fill="#f4e5c8" fill-opacity=".045"/>
    </pattern>
    <pattern id="scanlines" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1" fill="#ffffff" fill-opacity=".016"/>
    </pattern>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mapclip"><rect x="676" y="52" width="540" height="302" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 3.4px; fill: #8bff4a; }
      .micro { font-size: 9px; letter-spacing: 1.75px; fill: #8ba3b0; }
      .title { font-size: 70px; font-weight: 800; letter-spacing: -2.6px; }
      .tagline { font-size: 15px; font-weight: 800; letter-spacing: 2.5px; fill: #f4e5c8; }
      .lede { font-size: 13.5px; fill: #8ba3b0; }
      .chip { font-size: 10.5px; font-weight: 700; letter-spacing: 1.15px; }
      .hud-h { font-size: 8px; font-weight: 700; letter-spacing: 1.9px; fill: #8ba3b0; }
      .hud-v { font-size: 12px; font-weight: 800; letter-spacing: .5px; fill: #f4e5c8; }
      .pin-label { font-size: 8.5px; font-weight: 800; letter-spacing: 1.3px; }
      .coord { font-size: 8px; letter-spacing: 1.5px; fill: #8ba3b0; }
      .flow { stroke-dasharray: 5 7; animation: flow 1.8s linear infinite; }
      .scan { animation: scan 7.6s ease-in-out infinite; }
      .radar { animation: radar 11s linear infinite; transform-origin: 946px 203px; transform-box: view-box; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse-2 { animation: pulse 2.8s ease-in-out .7s infinite; }
      .pulse-3 { animation: pulse 2.8s ease-in-out 1.4s infinite; }
      .safe { animation: pulse 3.4s ease-in-out .35s infinite; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .glitch { animation: glitch 7.4s steps(1) infinite; }
      .glint { animation: glint 4.4s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes scan { 0% { transform: translateY(-96px); opacity: 0; } 14% { opacity: .55; } 76% { opacity: .16; } 100% { transform: translateY(266px); opacity: 0; } }
      @keyframes radar { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: .2; } }
      @keyframes glitch { 0%,91%,100% { transform: translate(0,0); } 92% { transform: translate(2px,0); } 93% { transform: translate(-2px,1px); } 94% { transform: translate(1px,-1px); } }
      @keyframes glint { 0%,100% { opacity: .25; } 45% { opacity: .9; } 55% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .flow,.scan,.radar,.pulse,.pulse-2,.pulse-3,.safe,.blink,.glitch,.glint { animation: none; } }
    </style>
  </defs>

