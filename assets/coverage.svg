<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="ctitle cdesc">
  <title id="ctitle">GmapsXploit coverage map: thirty-one endpoints across six surfaces</title>
  <desc id="cdesc">An exposed Google API key panel beside six cards for Maps, Places, Roads, Gemini, Cloud, and new APIs, with endpoint counts, example services, and a sample billing impact band.</desc>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04101a"/>
      <stop offset=".55" stop-color="#061622"/>
      <stop offset="1" stop-color="#0a0f17"/>
    </linearGradient>
    <radialGradient id="cglow" cx=".18" cy=".4" r=".7">
      <stop offset="0" stop-color="#8bff4a" stop-opacity=".1"/>
      <stop offset="1" stop-color="#8bff4a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2fd9f2" stroke-opacity=".04"/>
    </pattern>
    <pattern id="cdots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r=".85" fill="#f4e5c8" fill-opacity=".04"/>
    </pattern>
    <linearGradient id="cimpact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bff4a"/>
      <stop offset=".55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff2d46"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .head { font-size: 12px; font-weight: 800; letter-spacing: 3px; fill: #8bff4a; }
      .head-sub { font-size: 9px; letter-spacing: 1.8px; fill: #8ba3b0; }
      .card-title { font-size: 13px; font-weight: 800; letter-spacing: 1.7px; }
      .card-count { font-size: 11px; font-weight: 800; letter-spacing: 1px; }
      .card-ex { font-size: 9.5px; letter-spacing: .3px; }
      .card-tag { font-size: 7.5px; font-weight: 700; letter-spacing: 1.4px; }
      .panel-h { font-size: 8px; font-weight: 700; letter-spacing: 1.9px; fill: #8ba3b0; }
      .panel-v { font-size: 10px; font-weight: 800; letter-spacing: .4px; }
      .flow { stroke-dasharray: 4 6; animation: cflow 2s linear infinite; }
      .blink { animation: cblink 1.2s steps(1) infinite; }
      .pulse { animation: cpulse 3.2s ease-in-out infinite; }
      @keyframes cflow { to { stroke-dashoffset: -40; } }
      @keyframes cblink { 0%,49% { opacity: 1; } 50%,100% { opacity: .2; } }
      @keyframes cpulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow,.blink,.pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="440" fill="url(#cbg)"/>
  <rect width="1200" height="440" fill="url(#cgrid)"/>
  <rect width="1200" height="440" fill="url(#cdots)" opacity=".8"/>
  <rect width="1200" height="440" fill="url(#cglow)"/>

  <text x="40" y="38" class="mono head">SURFACE MAP</text>
  <text x="196" y="38" class="mono head-sub">/ WHAT ONE KEY CAN REACH</text>
  <text x="1160" y="38" text-anchor="end" class="mono head-sub" fill="#f4e5c8" opacity=".8">31 ENDPOINTS / 6 SURFACES</text>

  <!-- exposed key panel -->
  <g transform="translate(40 64)">
    <rect x="0" y="0" width="300" height="340" rx="14" fill="#07141f" fill-opacity=".92" stroke="#8bff4a" stroke-opacity=".22"/>
    <rect x="0" y="0" width="300" height="3" fill="#8bff4a" opacity=".55"/>

    <g transform="translate(22 26)">
      <path d="M10 0 C4 0 0 4 0 10 C0 18 10 26 10 26 C10 26 20 18 20 10 C20 4 16 0 10 0 Z"
