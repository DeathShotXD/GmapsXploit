    <text x="278" y="226" text-anchor="end" class="mono panel-v" fill="#8bff4a">UNRESTRICTED</text>

    <path d="M22 248 H278" stroke="#f4e5c8" stroke-opacity=".1"/>

    <text x="22" y="274" class="mono panel-h">SAMPLE RUN</text>
    <text x="22" y="300" class="mono" font-size="13" font-weight="800" fill="#f4e5c8" letter-spacing=".4">7 / 31 VULNERABLE</text>
    <text x="22" y="320" class="mono" font-size="10" fill="#8bff4a">EST. $8,383 / 100K REQ</text>

    <circle cx="262" cy="300" r="10" fill="#ff2d46" fill-opacity=".12" stroke="#ff2d46" stroke-opacity=".3"/>
    <circle cx="262" cy="300" r="3.2" fill="#ff2d46" class="blink"/>
  </g>

  <!-- connectors -->
