    <text x="18" y="48" class="mono card-ex" fill="#8ba3b0">Vision &#183; Translation &#183; Custom Search &#183; Address Validation +2</text>
    <rect x="18" y="66" width="356" height="2" rx="1" fill="#f4e5c8" fill-opacity=".07"/>
