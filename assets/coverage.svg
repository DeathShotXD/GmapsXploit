    <rect x="18" y="66" width="356" height="2" rx="1" fill="#f4e5c8" fill-opacity=".07"/>
    <rect x="18" y="66" width="142" height="2" rx="1" fill="#ff2d46" opacity=".55"/>
    <text x="370" y="80" text-anchor="end" class="mono card-tag" fill="#ff2d46" opacity=".65">PROBE &#8594;</text>
