    <text x="52" y="34" class="mono panel-h" fill="#ff2d46">EXPOSED KEY</text>
    <text x="22" y="66" class="mono" font-size="16" font-weight="800" fill="#f4e5c8" letter-spacing=".5">AIza&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
    <text x="22" y="84" class="mono panel-h">GOOGLE API KEY / CLIENT-SIDE</text>

    <path d="M22 106 H278" stroke="#f4e5c8" stroke-opacity=".1"/>

