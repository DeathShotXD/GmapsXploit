    <rect x="0" y="14" width="3" height="24" rx="1.5" fill="#8bff4a" opacity=".8"/>
    <text x="18" y="24" class="mono card-title" fill="#f4e5c8">PLACES</text>
    <text x="370" y="24" text-anchor="end" class="mono card-count" fill="#8bff4a">07</text>
    <text x="18" y="48" class="mono card-ex" fill="#8ba3b0">Text Search &#183; Details &#183; Autocomplete &#183; Photos +3</text>
    <rect x="18" y="66" width="356" height="2" rx="1" fill="#f4e5c8" fill-opacity=".07"/>
